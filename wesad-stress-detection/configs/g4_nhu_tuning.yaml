    - {model__n_estimators: [200], model__max_depth: [10], model__max_features: [0.5]}
  mlp:
    - {model__hidden_layer_sizes: [[32]], model__alpha: [0.0001], model__learning_rate_init: [0.001]}
    - {model__hidden_layer_sizes: [[64, 32]], model__alpha: [0.001], model__learning_rate_init: [0.001]}
    - {model__hidden_layer_sizes: [[32]], model__alpha: [0.001], model__learning_rate_init: [0.01]}
