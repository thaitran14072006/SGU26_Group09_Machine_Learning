# Four fixed candidates per model, declared before inspecting G4 outer scores.
protocol: g4_nhu_nested_physiological68_v1
features: data/features/g2_physiological68_group15_20261107/all_subjects.csv
schema: data/features/g2_physiological68_group15_20261107/feature_schema.json
feature_version: physiological_68_v1
feature_sha256: 2f2fddd678f333a800f2869d2e78b407934b2c3492190ed70e28d8a9107fd8ba
output_dir: outputs/g4_nhu_rf_mlp_outer4
expected_subjects: [S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S13, S14, S15, S16, S17]
models: [rf, mlp]
outer_subjects: [S4, S9, S11, S17]
record_mlp_loss: true
