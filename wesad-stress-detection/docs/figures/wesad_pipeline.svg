   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle" x="540" y="36.156" transform="rotate(-0 540 36.156)">Pipeline WESAD: tiền xử lý, đặc trưng và đánh giá LOSO</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(78.079431 106.423898)">WESAD raw</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(86.359509 121.908977)">15 người</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.305212 138.422727)">Ngực và cổ tay</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(266.196256 106.932648)">Lọc / đồng bộ / đổi đơn vị</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(261.870162 123.191164)">Giữ thời gian và tần số gốc</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(262.861022 139.039758)">Provider thực hiện một lần</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(537.574753 106.706633)">Cửa sổ 60 s, bước 5 s</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(530.754753 121.531711)">Nhãn 1/2/3 đa số ≥90%</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(518.345378 138.256867)">Giữ nhãn khác trong mẫu số</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(840.348144 106.79343)">Trích xuất sinh lý 68</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(803.630487 122.278508)">ACC/EMG: trung bình 12 đoạn 5 s</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(835.371503 139.003664)">NaN có lý do, Inf là lỗi</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(833.017675 225.360273)">Bảng G2: 6.189 cửa sổ</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(826.990878 240.185352)">68 feature + 8 metadata</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(796.804472 256.436133)">Không bỏ hàng riêng theo cảm biến</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(191.16 232.161094)">LOSO 15 lượt: mỗi lượt giữ 1 subject test, 14 subject train</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(131.308125 250.443281)">X chỉ gồm feature; subject, thời gian, nhãn và quality flag không nằm trong X</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(199.276312 364.532438)">TRAIN — 14 subject</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(171.405375 381.42525)">Fit median imputer trên train</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(136.506 397.598063)">Fit StandardScaler: LR / KNN / SVM / MLP</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(734.241 363.060094)">TEST — 1 subject</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(665.553187 381.342281)">Chỉ transform bằng imputer/scaler đã fit</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(672.758812 399.070406)">Không fit hoặc chọn tham số trên test</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="522.396" y="368.3904" transform="rotate(-0 522.396 368.3904)">Bộ biến đổi từ train</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(172.984594 495.130797)">Fit mô hình mặc định trên train</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(161.0685 509.955875)">Dummy / LR / KNN / SVM / RF / MLP</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(140.961703 526.714547)">Không tuning, cân bằng lớp hoặc selection</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(707.103031 496.192555)">Dự đoán ngoài mẫu trên test</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(716.961781 511.267711)">180 fold, 74.268 dự đoán</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(706.677641 526.752789)">Ba lớp [1,2,3]; nhị phân [0,1]</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="522.396" y="498.7872" transform="rotate(-0 522.396 498.7872)">Mô hình đã fit</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="540" y="592.4232" transform="rotate(-0 540 592.4232)">Metric từng người → trung bình ± SD mẫu qua 15 người; confusion matrix từ dự đoán ngoài mẫu</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #435869" x="540" y="625.716" transform="rotate(-0 540 625.716)">Dummy và RF không dùng StandardScaler trong pipeline hiện tại. NaN được xử lý trong train fold; không impute/scaler trên toàn bảng.</text>
   </g>
  </g>
 </g>
